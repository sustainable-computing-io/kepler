name: Nominate New Maintainer or Role
description: Use this template to nominate a new maintainer, assign a new role, or self-nominate.
labels:
  - kind/documentation
  - kind/nomination

body:
  - type: textarea
    id: nominee
    attributes:
      label: 🧑‍💼 Nominee Introduction
      description: |
        Please include the nominee's GitHub ID or Slack ID, the role they are being nominated for, and a brief explanation of why they are being nominated.
      placeholder: |
        GitHub ID: @username
        Role: Maintainer
        Reason: Contributed extensively to XYZ area...
    validations:
      required: true

  - type: textarea
    id: support
    attributes:
      label: 🔗 Supporting Contributions
      description: |
        Provide links that support this nomination — for example, GitHub PRs, issue discussions, talks, blogs, or community contributions.
      placeholder: |
        - https://github.com/sustainable-computing-io/kepler/pull/
        - Presented at ABC Conference: [link]
    validations:
      required: true

  - type: checkboxes
    id: self_nomination
    attributes:
      label: 🙋 Self Nomination
      description: Is this a self-nomination?
      options:
        - label: Yes, this is a self-nomination.

  - type: input
    id: nominee_approval
    attributes:
      label: ✅ Nominee Approval (if not self-nomination)
      description: |
        If this is not a self-nomination, please confirm that the nominee has agreed to take the role. Mention how or where the approval was obtained (e.g., Slack message, email).
      placeholder: Confirmed via Slack message on 2025-07-15.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 📜 Governance Confirmation
      description: |
        Confirm that you have read and agree with the [GOVERNANCE.md](https://github.com/sustainable-computing-io/kepler/blob/main/GOVERNANCE.md). Please include your role and sign-up date in the comment.
      options:
        - label: I confirm I have read and agree with GOVERNANCE.md.

  - type: input
    id: link
    attributes:
      label: 🔗 MAINTAINER.md PR Link
      description: Please provide the link to the PR that updates `MAINTAINER.md`.
      placeholder: https://github.com/sustainable-computing-io/kepler/pull/
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## After the merge

        The checklist below is for the nominee once the `MAINTAINERS.md` PR is
        merged. Leave it unchecked when opening the issue and tick items as they
        are done. One-off links and invites are posted in the
        [#kepler-project](https://cloud-native.slack.com/archives/C05QK3KN3HT) channel.

  - type: checkboxes
    id: onboarding
    attributes:
      label: 🧭 Onboarding (after merge)
      description: Access, calls, channels and first tasks for the new maintainer.
      options:
        - label: Granted write access / added to the appropriate GitHub team
        - label: Added to the [`OWNERS`](https://github.com/sustainable-computing-io/kepler/blob/main/OWNERS) file(s) for the areas you review
        - label: Joined the [CNCF Slack](https://slack.cncf.io) and [#kepler-project](https://cloud-native.slack.com/archives/C05QK3KN3HT)
        - label: Added the community call from the [LFX calendar](https://zoom-lfx.platform.linuxfoundation.org/meetings/kepler) and can open the [agenda / notes doc](https://docs.google.com/document/d/1YtflOiC8Eq61MIrX2DW2KT2XcJjBZnvgyKrkjUCr_ZE/edit)
        - label: Read the maintainer section of [`GOVERNANCE.md`](https://github.com/sustainable-computing-io/kepler/blob/main/GOVERNANCE.md#maintainers) and [`CONTRIBUTING.md`](https://github.com/sustainable-computing-io/kepler/blob/main/CONTRIBUTING.md)
        - label: Reviewed a first open PR or picked up a triage item
