# Re-runs the failed jobs of a CI run, so a transient failure (a GitHub API
# timeout, a runner that went away) does not leave a PR or main red until
# someone clicks "Re-run failed jobs".
name: Rerun Failed Jobs

on: # yamllint disable-line rule:truthy
  workflow_run:
    # NOTE: only workflows on GitHub-hosted runners belong here. The e2e,
    # k8s-bm and profiling workflows share one self-hosted runner, and
    # retrying them would put load back on its queue.
    workflows:
      - PR Checks
      - Push
    types:
      - completed

# default permissions as read only
permissions: read-all

jobs:
  rerun:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    # Retry failures only, at most twice (attempts 2 and 3). Cancelled runs,
    # such as ones superseded by a newer push, and runs waiting for approval
    # are left alone.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    steps:
      - name: Wait before rerun
        # gives a transient outage time to clear
        run: sleep 180

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # someone may have re-run it by hand while we waited
          status=$(gh run view "$RUN_ID" --json status --jq .status)
          if [ "$status" != "completed" ]; then
            echo "Run $RUN_ID is $status, nothing to do"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
