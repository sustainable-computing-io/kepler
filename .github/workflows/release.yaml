name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    if: github.repository == 'sustainable-computing-io/kepler'
    runs-on: ubuntu-latest
    env:
      IMG_BASE: quay.io/sustainable_computing_io
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: setting fetch-depth to 0 to retrieve the entire history
          # instead of a shallow -clone so that all tags are fetched as well.
          # This is necessary for computing the VERSION using `git describe`
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! ${RELEASE_TAG:-} =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' "RELEASE_TAG must be a stable version such as v1.2.3" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: latest

      - name: Login to Image Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.IMG_BASE }}
          username: ${{ secrets.BOT_NAME }}
          password: ${{ secrets.BOT_TOKEN }}

      - name: make deps
        shell: bash
        run: make deps

      - name: Build Image
        shell: bash
        run: |
          make image VERSION="$RELEASE_TAG"

      - name: Update Helm Chart Version
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          # Remove 'v' prefix from version
          CHART_VERSION=${VERSION#v}
          # Update Chart.yaml with the release version
          sed -i "s/^version:.*/version: $CHART_VERSION/" manifests/helm/kepler/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" manifests/helm/kepler/Chart.yaml

      - name: Package Helm Chart
        shell: bash
        run: |
          mkdir -p helm-releases
          VERSION="$RELEASE_TAG"
          # Remove 'v' prefix from version
          CHART_VERSION=${VERSION#v}
          helm package manifests/helm/kepler -d helm-releases
          # Rename the helm chart to include 'helm' identifier
          mv "helm-releases/kepler-${CHART_VERSION}.tgz" "helm-releases/kepler-helm-${CHART_VERSION}.tgz"

      - name: Build Kepler binary
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          # Remove 'v' prefix from version
          VERSION=${VERSION#v}
          make build PRODUCTION=1
          mv bin/kepler-release bin/kepler
          # Currently the binary is built for linux-amd64 only
          tar -czvf "bin/kepler-${VERSION}.linux-amd64.tar.gz" bin/kepler

      - name: govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            helm-releases/*.tgz
            bin/*.tar.gz

      - name: Push Image
        shell: bash
        run: |
          make push VERSION="$RELEASE_TAG"

      - name: Push Helm Chart to OCI registry
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          # Remove 'v' prefix from version
          CHART_VERSION=${VERSION#v}
          helm push "helm-releases/kepler-helm-${CHART_VERSION}.tgz" "oci://$IMG_BASE/charts"

  sign:
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign and verify release archives
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          identity="https://github.com/sustainable-computing-io/kepler/.github/workflows/release.yaml@refs/tags/$RELEASE_TAG"
          for archive in "bin/kepler-${version}.linux-amd64.tar.gz" "helm-releases/kepler-helm-${version}.tgz"; do
            test -s "$archive"
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
            test -s "$archive.sigstore.json"
            cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            helm-releases/*.tgz
            helm-releases/*.tgz.sigstore.json
            bin/*.tar.gz
            bin/*.tar.gz.sigstore.json

  release:
    needs: sign
    permissions:
      # contents: write is required for publishing Github Releases
      # This follows Github's recommended pattern: read-only defaults with minimal job-level permissions
      # See: https://github.com/softprops/action-gh-release?tab=readme-ov-file#permissions
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Verify downloaded archives
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          identity="https://github.com/sustainable-computing-io/kepler/.github/workflows/release.yaml@refs/tags/$RELEASE_TAG"
          for archive in "bin/kepler-${version}.linux-amd64.tar.gz" "helm-releases/kepler-helm-${version}.tgz"; do
            test -s "$archive"
            test -s "$archive.sigstore.json"
            cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: release-${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          make_latest: true
          files: |
            helm-releases/*.tgz
            helm-releases/*.tgz.sigstore.json
            bin/*.tar.gz
            bin/*.tar.gz.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
