apiVersion: v1
kind: Service
metadata:
  name: {{include "kepler.fullname" .}}
  namespace: {{include "kepler.namespace" .}}
  labels:
    {{- include "kepler.labels" . | nindent 4}}
  {{- with .Values.annotations}}
  annotations:
    {{- toYaml . | nindent 4}}
  {{- end}}
spec:
  type: {{.Values.service.type}}
  ports:
  - name: {{include "kepler.portName" .}}
    port: {{.Values.service.port}}
    targetPort: {{default (include "kepler.portName" .) .Values.service.targetPort}}
    protocol: {{.Values.service.protocol}}
  selector:
    {{- include "kepler.selectorLabels" . | nindent 4}}
