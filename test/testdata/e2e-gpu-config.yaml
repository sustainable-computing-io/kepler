# Kepler configuration for GPU e2e tests on a host with a real NVIDIA GPU.
# GPU hosts in the cloud usually have no RAPL, so CPU power comes from the
# fake CPU meter and only the GPU readings are real.
log:
  level: debug
  format: text
monitor:
  interval: 3s
  staleness: 10s
  maxTerminated: 100
  minTerminatedEnergyThreshold: 1
host:
  procfs: /proc
  sysfs: /sys
cpu:
  preferredMeters:
    - fake
exporter:
  prometheus:
    enabled: true
    metricsLevel:
      - node
      - process
      - container
      - vm
      - pod
web:
  listenAddresses:
    - :28282
kube:
  enabled: false
experimental:
  gpu:
    enabled: true
